<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Campo Minado</title>
    <style>
      :root {
        --bg: #eceae4;
        --p: #fbfaf7;
        --b: #cfcbc0;
        --tx: #1c1d20;
        --mu: #6d6f76;
        --ac: #d6381f;
        --cl: #c9c5b8;
        --cl2: #bdb9ab;
        --op: #f3f1ea;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1013;
          --p: #171a20;
          --b: #2a2f39;
          --tx: #e8e8e4;
          --mu: #8a8f9a;
          --ac: #e8412c;
          --cl: #2c313c;
          --cl2: #363c49;
          --op: #12141a;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e1013;
        --p: #171a20;
        --b: #2a2f39;
        --tx: #e8e8e4;
        --mu: #8a8f9a;
        --ac: #e8412c;
        --cl: #2c313c;
        --cl2: #363c49;
        --op: #12141a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        background: var(--bg);
        color: var(--tx);
        font-family:
          "Barlow",
          system-ui,
          Segoe UI,
          Arial,
          sans-serif;
        min-height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 22px 12px 40px;
        -webkit-user-select: none;
        user-select: none;
      }
      h1 {
        font:
          800 34px/1 "Arial Narrow",
          "Barlow Condensed",
          Impact,
          sans-serif;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      h1 i {
        color: var(--ac);
        font-style: normal;
      }
      .sub {
        color: var(--mu);
        font-size: 13px;
        margin: 6px 0 16px;
        text-align: center;
      }
      .lv {
        display: flex;
        gap: 6px;
        margin-bottom: 14px;
      }
      .lv button {
        background: var(--p);
        color: var(--mu);
        border: 1px solid var(--b);
        padding: 8px 16px;
        font: 700 13px system-ui;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        cursor: pointer;
        border-radius: 3px;
      }
      .lv button.on {
        color: var(--tx);
        border-color: var(--ac);
        box-shadow: inset 0 -3px 0 var(--ac);
      }
      .cfg {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 14px;
        color: var(--mu);
        font-size: 13px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .cfg input {
        width: 72px;
        background: var(--p);
        color: var(--tx);
        border: 1px solid var(--b);
        padding: 7px 8px;
        font: 700 14px system-ui;
        border-radius: 3px;
      }
      .cfg input:focus {
        outline: 0;
        border-color: var(--ac);
      }
      .cfg button {
        background: var(--ac);
        color: #fff;
        border: 0;
        padding: 8px 14px;
        font: 700 13px system-ui;
        border-radius: 3px;
        cursor: pointer;
      }
      .box {
        background: var(--p);
        border: 1px solid var(--b);
        padding: 10px;
        border-radius: 4px;
        max-width: 100%;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        gap: 10px;
      }
      .dg {
        font:
          700 26px/1 ui-monospace,
          Consolas,
          monospace;
        background: #0a0a0a;
        color: #ff4a2e;
        padding: 4px 9px;
        min-width: 68px;
        text-align: center;
        border-radius: 3px;
        letter-spacing: 2px;
      }
      #face {
        width: 44px;
        height: 44px;
        font-size: 24px;
        background: var(--cl);
        border: 1px solid var(--b);
        border-radius: 4px;
        cursor: pointer;
      }
      #face:active {
        transform: translateY(1px);
      }
      #g {
        display: grid;
        gap: 1px;
        background: var(--b);
        border: 1px solid var(--b);
        touch-action: manipulation;
        margin: auto;
      }
      .c {
        width: var(--s);
        height: var(--s);
        background: var(--cl);
        display: grid;
        place-items: center;
        font: 800 calc(var(--s) * 0.62)/1 system-ui;
        cursor: pointer;
        box-shadow: inset 2px 2px 0 var(--cl2);
      }
      .c:hover:not(.o) {
        filter: brightness(1.1);
      }
      .c.o {
        background: var(--op);
        box-shadow: none;
        cursor: default;
      }
      .c.m {
        background: var(--ac);
      }
      .c.x {
        background: #7a1e12;
      }
      .n1 {
        color: #2f6fd6;
      }
      .n2 {
        color: #2a9d6f;
      }
      .n3 {
        color: #e8412c;
      }
      .n4 {
        color: #7c4fd6;
      }
      .n5 {
        color: #c0651f;
      }
      .n6 {
        color: #1f8fa3;
      }
      .n7 {
        color: #888;
      }
      .n8 {
        color: #999;
      }
      #msg {
        height: 24px;
        margin-top: 12px;
        font-weight: 700;
        text-align: center;
      }
      .hint {
        color: var(--mu);
        font-size: 12px;
        margin-top: 6px;
        text-align: center;
        max-width: 420px;
      }
      .rec {
        color: var(--mu);
        font-size: 12px;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Campo <i>Minado</i></h1>
    <p class="sub">Revele todas as casas sem pisar em uma mina.</p>
    <div class="lv" id="lv">
      <button data-k="f">Fácil</button><button data-k="m">Médio</button
      ><button data-k="d">Difícil</button>
    </div>
    <div class="cfg">
      <label for="nm">Bombas</label
      ><input
        id="nm"
        type="number"
        inputmode="numeric"
        min="1"
        step="1"
      /><button id="ap">Aplicar</button><span id="rg"></span>
    </div>
    <div class="box">
      <div class="bar">
        <div class="dg" id="mc">010</div>
        <button id="face" title="Reiniciar">🙂</button>
        <div class="dg" id="tm">000</div>
      </div>
      <div id="g"></div>
    </div>
    <div id="msg"></div>
    <div class="rec" id="rec"></div>
    <p class="hint">
      Clique esquerdo revela · clique direito (ou segurar no celular) coloca
      bandeira · clique num número já aberto abre as casas ao redor se as
      bandeiras baterem.
    </p>
    <script>
      const LV = {
        f: { r: 9, c: 9, m: 10 },
        m: { r: 16, c: 16, m: 40 },
        d: { r: 16, c: 30, m: 99 },
      };
      const $ = (s) => document.querySelector(s);
      let k = "f",
        R,
        C,
        M,
        mine,
        adj,
        open,
        flag,
        els,
        first,
        over,
        left,
        opened,
        secs,
        iv,
        lp = false;
      const pad = (n) => String(Math.max(0, Math.min(999, n))).padStart(3, "0");
      function nb(i) {
        const r = (i / C) | 0,
          c = i % C,
          o = [];
        for (let a = -1; a <= 1; a++)
          for (let b = -1; b <= 1; b++) {
            if (!a && !b) continue;
            const y = r + a,
              x = c + b;
            if (y >= 0 && y < R && x >= 0 && x < C) o.push(y * C + x);
          }
        return o;
      }
      function size() {
        const w = Math.min(innerWidth - 48, 980);
        return Math.max(18, Math.min(34, Math.floor(w / C)));
      }
      function start(key, cm) {
        k = key || k;
        ({ r: R, c: C, m: M } = LV[k]);
        const n = R * C,
          mx = n - 9;
        if (cm) M = Math.max(1, Math.min(mx, Math.floor(cm)));
        $("#nm").value = M;
        $("#nm").max = mx;
        $("#rg").textContent = `(de 1 a ${mx})`;
        mine = Array(n).fill(false);
        adj = Array(n).fill(0);
        open = Array(n).fill(false);
        flag = Array(n).fill(false);
        first = true;
        over = false;
        left = M;
        opened = 0;
        secs = 0;
        clearInterval(iv);
        const g = $("#g");
        g.style.setProperty("--s", size() + "px");
        g.style.gridTemplateColumns = `repeat(${C},var(--s))`;
        g.innerHTML = "";
        els = [];
        for (let i = 0; i < n; i++) {
          const d = document.createElement("div");
          d.className = "c";
          d.dataset.i = i;
          g.appendChild(d);
          els.push(d);
        }
        $("#mc").textContent = pad(M);
        $("#tm").textContent = "000";
        $("#face").textContent = "🙂";
        $("#msg").textContent = "";
        document
          .querySelectorAll("#lv button")
          .forEach((b) => b.classList.toggle("on", b.dataset.k === k));
        showRec();
      }
      function showRec() {
        let v = null;
        try {
          v = localStorage.getItem("cm-" + k + "-" + M);
        } catch (e) {}
        $("#rec").textContent = v
          ? `Melhor tempo (${{ f: "fácil", m: "médio", d: "difícil" }[k]}, ${M} bombas): ${v}s`
          : "";
      }
      function plant(safe) {
        const ban = new Set([safe, ...nb(safe)]);
        let p = 0;
        while (p < M) {
          const i = (Math.random() * R * C) | 0;
          if (!mine[i] && !ban.has(i)) {
            mine[i] = true;
            p++;
          }
        }
        for (let i = 0; i < R * C; i++)
          adj[i] = nb(i).filter((j) => mine[j]).length;
        iv = setInterval(() => {
          secs++;
          $("#tm").textContent = pad(secs);
        }, 1000);
      }
      function paint(i) {
        const e = els[i];
        e.className = "c" + (open[i] ? " o" : "");
        e.textContent = "";
        if (open[i] && adj[i] && !mine[i]) {
          e.textContent = adj[i];
          e.classList.add("n" + adj[i]);
        } else if (flag[i]) e.textContent = "🚩";
      }
      function reveal(s) {
        const st = [s];
        while (st.length) {
          const i = st.pop();
          if (open[i] || flag[i]) continue;
          open[i] = true;
          opened++;
          paint(i);
          if (mine[i]) return lose(i);
          if (!adj[i])
            nb(i).forEach((j) => {
              if (!open[j] && !flag[j]) st.push(j);
            });
        }
        if (opened === R * C - M) win();
      }
      function lose(hit) {
        over = true;
        clearInterval(iv);
        $("#face").textContent = "😵";
        $("#msg").textContent = "Boom! Você perdeu.";
        for (let i = 0; i < R * C; i++) {
          if (mine[i] && !flag[i]) {
            els[i].className = "c o m";
            els[i].textContent = "💣";
          } else if (!mine[i] && flag[i]) {
            els[i].className = "c o x";
            els[i].textContent = "✖";
          }
        }
        els[hit].className = "c o x";
        els[hit].textContent = "💣";
      }
      function win() {
        over = true;
        clearInterval(iv);
        $("#face").textContent = "😎";
        for (let i = 0; i < R * C; i++)
          if (mine[i] && !flag[i]) {
            flag[i] = true;
            paint(i);
          }
        $("#mc").textContent = "000";
        $("#msg").textContent = `Vitória em ${secs}s!`;
        try {
          const b = +localStorage.getItem("cm-" + k + "-" + M);
          if (!b || secs < b) localStorage.setItem("cm-" + k + "-" + M, secs);
        } catch (e) {}
        showRec();
      }
      function toggle(i) {
        if (over || open[i]) return;
        flag[i] = !flag[i];
        left += flag[i] ? -1 : 1;
        $("#mc").textContent = pad(left);
        paint(i);
      }
      function chord(i) {
        if (!open[i] || !adj[i]) return;
        const n = nb(i);
        if (n.filter((j) => flag[j]).length === adj[i])
          n.forEach((j) => {
            if (!open[j] && !flag[j] && !over) reveal(j);
          });
      }
      function act(i) {
        if (over) return;
        if (open[i]) return chord(i);
        if (flag[i]) return;
        if (first) {
          first = false;
          plant(i);
        }
        reveal(i);
      }
      const g = $("#g");
      let pt;
      g.addEventListener("click", (e) => {
        const i = e.target.dataset.i;
        if (i === undefined) return;
        if (lp) {
          lp = false;
          return;
        }
        act(+i);
      });
      g.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        const i = e.target.dataset.i;
        if (i !== undefined) toggle(+i);
      });
      g.addEventListener(
        "touchstart",
        (e) => {
          const i = e.target.dataset.i;
          if (i === undefined) return;
          lp = false;
          pt = setTimeout(() => {
            lp = true;
            toggle(+i);
            if (navigator.vibrate) navigator.vibrate(30);
          }, 380);
        },
        { passive: true },
      );
      ["touchend", "touchmove", "touchcancel"].forEach((t) =>
        g.addEventListener(t, () => clearTimeout(pt), { passive: true }),
      );
      $("#face").onclick = () => start(null, M);
      const apply = () => {
        const v = parseInt($("#nm").value, 10);
        start(null, isNaN(v) ? M : v);
      };
      $("#ap").onclick = apply;
      $("#nm").addEventListener("keydown", (e) => {
        if (e.key === "Enter") apply();
      });
      $("#lv").onclick = (e) => {
        if (e.target.dataset.k) start(e.target.dataset.k);
      };
      addEventListener("resize", () =>
        g.style.setProperty("--s", size() + "px"),
      );
      start("f");
    </script>
  </body>
</html>
